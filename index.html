<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Base Selector</title>
    <style>
        :root {
            --bg-color: #120909;
            --card-bg: #1a0f0f;
            --text-color: #fff5f5;
            --text-muted: #b89b9b;
            --primary: #dc2626;
            --primary-hover: #b91c1c;
            --st1-color: #f97316;
            --st2-color: #ef4444;
            --border: #3d1c1c;
            --danger: #991b1b;
            --rank-bg: rgba(249, 115, 22, 0.15);
            --rank-text: #fb923c;
            --nickname-bg: rgba(220, 38, 38, 0.15);
            --nickname-text: #f87171;
            --transition-smooth: cubic-bezier(0.16, 1, 0.3, 1);
            --shadow-color: rgba(220, 38, 38, 0.15);
            --item-bg: rgba(255, 255, 255, 0.02);
            --item-hover: rgba(220, 38, 38, 0.06);
            --bg-image: none;
        }

        [data-theme="light"] {
            --bg-color: #fff8f6;
            --card-bg: #ffffff;
            --text-color: #2b1111;
            --text-muted: #8c5c5c;
            --primary: #e11d48;
            --primary-hover: #be123c;
            --st1-color: #ea580c;
            --st2-color: #e11d48;
            --border: #fecdd3;
            --danger: #b91c1c;
            --rank-bg: rgba(234, 88, 12, 0.12);
            --rank-text: #c2410c;
            --nickname-bg: rgba(225, 29, 72, 0.12);
            --nickname-text: #be123c;
            --shadow-color: rgba(225, 29, 72, 0.08);
            --item-bg: rgba(225, 29, 72, 0.01);
            --item-hover: rgba(225, 29, 72, 0.04);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }

        body {
            background-color: var(--bg-color);
            background-image: var(--bg-image);
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--text-color);
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }

        #punisher-alert {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(5, 2, 2, 0.85);
            backdrop-filter: blur(8px);
            z-index: 99999;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        #punisher-alert.show { opacity: 1; pointer-events: auto; }

        .punisher-text {
            font-size: 3.5rem;
            font-weight: 900;
            color: #ff1a1a;
            text-shadow: 0 0 20px rgba(255, 0, 0, 0.9), 0 0 40px rgba(139, 0, 0, 1), 0 2px 10px #000;
            text-align: center;
            transform: scale(0.8);
            transition: transform 0.4s var(--transition-smooth);
        }
        #punisher-alert.show .punisher-text { transform: scale(1); }

        #welcome-splash {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: #0d0505;
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 15px;
            transition: transform 1s var(--transition-smooth), opacity 0.8s ease;
        }
        #welcome-splash.slide-up { transform: translateY(-100%); opacity: 0.9; }

        .splash-content { text-align: center; animation: splashIn 0.8s var(--transition-smooth) forwards; }

        .splash-title {
            font-size: 2.5rem; font-weight: 800;
            background: linear-gradient(135deg, #fff5f5, #f87171, #f97316);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }
        .splash-subtitle { font-size: 1rem; color: var(--text-muted); letter-spacing: 2px; }

        @keyframes splashIn {
            from { opacity: 0; transform: translateY(20px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .container { max-width: 1400px; margin: 0 auto; }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border);
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
            box-shadow: 0 10px 30px -10px var(--shadow-color);
            backdrop-filter: blur(10px);
        }

        h1 { font-size: 1.5rem; color: var(--text-color); }

        .actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

        .btn-theme-toggle {
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text-color);
            width: 42px; height: 42px;
            border-radius: 8px;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.2rem;
            transition: transform 0.3s var(--transition-smooth), background 0.2s;
        }
        .btn-theme-toggle:hover { transform: rotate(20deg) scale(1.05); background: var(--item-hover); }

        .btn-vip {
            background: linear-gradient(135deg, #f97316, #dc2626);
            color: white; border: none;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer; font-weight: 700;
            box-shadow: 0 4px 15px rgba(249, 115, 22, 0.4);
            transition: transform 0.25s var(--transition-smooth), box-shadow 0.25s ease;
        }
        .btn-vip:hover { transform: translateY(-2px) scale(1.03); box-shadow: 0 6px 20px rgba(220, 38, 38, 0.6); }

        .btn-creator {
            position: relative;
            background: #150a0a !important;
            color: #fff !important;
            border: 2px solid transparent;
            padding: 10px 22px;
            border-radius: 8px;
            cursor: pointer; font-weight: 700;
            text-decoration: none;
            display: inline-flex; align-items: center; justify-content: center;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(220, 38, 38, 0.3);
        }
        .btn-creator::before {
            content: '';
            position: absolute; inset: -3px;
            border-radius: 10px;
            background: linear-gradient(45deg, #ff0000, #ff7700, #ffaa00, #ff2200, #ff0000);
            background-size: 400%;
            z-index: -1;
            animation: neonGlow 4s linear infinite;
        }
        @keyframes neonGlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .btn-creator span {
            background: linear-gradient(45deg, #ffffff, #ff4d4d, #ffb703);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }

        button {
            background-color: var(--primary);
            color: white; border: none;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: background-color 0.2s ease, transform 0.25s var(--transition-smooth), box-shadow 0.25s ease;
        }
        button:hover {
            background-color: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px -5px rgba(220, 38, 38, 0.4);
        }

        button.btn-rotate { background-color: #ea580c; }
        button.btn-danger { background-color: #991b1b; }
        button.btn-add-station {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: #fff; font-weight: 700;
            box-shadow: 0 4px 15px rgba(34, 197, 94, 0.35);
        }
        button.btn-add-station:hover {
            background: linear-gradient(135deg, #16a34a, #15803d);
            box-shadow: 0 6px 20px rgba(34, 197, 94, 0.5);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
        }

        @media (max-width: 768px) {
            .punisher-text { font-size: 2.2rem; padding: 0 15px; }
        }

        .panel {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            height: 580px;
            box-shadow: 0 10px 30px -10px var(--shadow-color);
            backdrop-filter: blur(10px);
            animation: panelIn 0.35s var(--transition-smooth);
        }
        @keyframes panelIn {
            from { opacity: 0; transform: translateY(8px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border);
            gap: 8px;
        }

        .panel-title { font-size: 1.2rem; font-weight: bold; }
        .header-right { display: flex; align-items: center; gap: 6px; }

        .badge-count {
            background: var(--item-hover);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.85rem;
            color: var(--text-color);
            white-space: nowrap;
        }

        .btn-del-station {
            background: transparent;
            color: var(--text-muted);
            border: none;
            padding: 3px 7px;
            border-radius: 6px;
            font-size: 0.8rem;
            line-height: 1;
            cursor: pointer;
            box-shadow: none;
            font-weight: 700;
        }
        .btn-del-station:hover {
            color: #ef4444;
            background: rgba(239, 68, 68, 0.12);
            transform: none;
            box-shadow: none;
        }

        .player-list {
            overflow-y: auto;
            flex-grow: 1;
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-left: 5px;
        }

        .player-item {
            background: var(--item-bg);
            border: 1px solid var(--border);
            padding: 12px 15px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .player-info { display: flex; flex-direction: column; gap: 6px; }
        .player-header-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .player-name { font-weight: bold; font-size: 1rem; }
        .player-rank-badge { background-color: var(--rank-bg); color: var(--rank-text); padding: 2px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: 600; }
        .player-nickname-badge { background-color: var(--nickname-bg); color: var(--nickname-text); padding: 2px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: 500; }
        .player-meta { font-size: 0.8rem; color: var(--text-muted); display: flex; gap: 12px; flex-wrap: wrap; }

        .player-actions { display: flex; gap: 5px; }
        .btn-icon {
            background: transparent;
            color: var(--text-muted);
            padding: 6px;
            border-radius: 6px;
            cursor: pointer;
            transition: color 0.2s, background 0.2s, transform 0.2s;
            border: none;
            font-size: 0.95rem;
        }
        .btn-icon:hover { color: var(--text-color); background: var(--item-hover); transform: scale(1.1); box-shadow: none; }
        .btn-icon.delete:hover { color: #ef4444; background: rgba(239, 68, 68, 0.1); }
        .btn-icon.edit:hover { color: #22c55e; background: rgba(34, 197, 94, 0.1); }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(6px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .modal.show { display: flex; opacity: 1; }

        .modal-content {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            max-height: 90vh;
            overflow-y: auto;
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-shadow: 0 20px 40px -15px var(--shadow-color);
        }

        .form-group { display: flex; flex-direction: column; gap: 5px; }
        .form-group label { font-size: 0.9rem; color: var(--text-muted); }
        .form-group input, .form-group select {
            background: var(--bg-color);
            border: 1px solid var(--border);
            color: var(--text-color);
            padding: 10px;
            border-radius: 8px;
            outline: none;
        }
        .form-group input:focus, .form-group select:focus { border-color: var(--primary); }

        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 10px; }

        .search-box {
            width: 100%;
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text-color);
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            outline: none;
            box-shadow: 0 4px 12px -4px var(--shadow-color);
            backdrop-filter: blur(10px);
        }
        .search-box:focus { border-color: var(--primary); }

        .empty-state { text-align: center; color: var(--text-muted); margin-top: 50px; }

        .station-rows { display: flex; flex-direction: column; gap: 8px; }

        .station-row {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .station-row select { flex: 1; }

        .btn-remove-station {
            background: rgba(239, 68, 68, 0.15);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.3);
            width: 38px;
            height: 42px;
            min-width: 38px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            padding: 0;
            font-size: 1rem;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: none;
        }
        .btn-remove-station:hover {
            background: #ef4444;
            color: white;
            transform: none;
            box-shadow: none;
        }

        .btn-add-station-row {
            background: transparent;
            border: 1px dashed var(--border);
            color: var(--text-muted);
            padding: 9px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            width: 100%;
            transition: all 0.2s;
            box-shadow: none;
        }
        .btn-add-station-row:hover {
            border-color: var(--primary);
            color: var(--primary);
            background: var(--item-hover);
            transform: none;
            box-shadow: none;
        }

        .date-group { position: relative; }

        .date-input-wrap { position: relative; display: flex; align-items: center; }
        .date-input-wrap input { width: 100%; padding-left: 40px !important; }
        .date-input-wrap .date-icon-btn {
            position: absolute;
            left: 6px;
            top: 50%;
            transform: translateY(-50%);
            background: transparent;
            color: var(--text-muted);
            border: none;
            padding: 6px 8px;
            border-radius: 6px;
            font-size: 1rem;
            line-height: 1;
            cursor: pointer;
            box-shadow: none;
        }
        .date-input-wrap .date-icon-btn:hover {
            background: var(--item-hover);
            color: var(--text-color);
            transform: translateY(-50%);
            box-shadow: none;
        }

        .jp-calendar {
            position: absolute;
            top: calc(100% + 8px);
            left: 0;
            width: 100%;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 12px;
            z-index: 6000;
            display: none;
            direction: rtl;
            box-shadow: 0 26px 55px -18px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(220, 38, 38, 0.08);
            backdrop-filter: blur(12px);
        }
        .jp-calendar.show { display: block; animation: jpFadeDown 0.18s var(--transition-smooth); }
        .jp-calendar.open-up { top: auto; bottom: calc(100% + 8px); }
        .jp-calendar.open-up.show { animation: jpFadeUp 0.18s var(--transition-smooth); }

        @keyframes jpFadeDown {
            from { opacity: 0; transform: translateY(-8px) scale(0.98); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }
        @keyframes jpFadeUp {
            from { opacity: 0; transform: translateY(8px) scale(0.98); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        .jp-head { display: flex; align-items: center; gap: 6px; margin-bottom: 10px; }

        .jp-nav {
            flex: 0 0 auto;
            width: 30px; height: 30px;
            padding: 0;
            border-radius: 8px;
            background: var(--item-hover);
            border: 1px solid var(--border);
            color: var(--text-color);
            font-size: 0.75rem;
            line-height: 1;
            display: flex; align-items: center; justify-content: center;
            box-shadow: none;
        }
        .jp-nav:hover { background: var(--primary); color: #fff; transform: none; box-shadow: none; }

        .jp-select {
            flex: 1 1 auto;
            min-width: 0;
            background: var(--bg-color);
            border: 1px solid var(--border);
            color: var(--text-color);
            border-radius: 8px;
            padding: 6px 8px;
            font-size: 0.82rem;
            font-weight: 600;
            outline: none;
            cursor: pointer;
            text-align: center;
        }
        .jp-select:focus { border-color: var(--primary); }

        .jp-week,
        .jp-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 3px;
        }
        .jp-week { margin-bottom: 4px; }
        .jp-week span {
            text-align: center;
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--text-muted);
            padding: 4px 0;
        }

        .jp-day {
            height: 34px;
            display: flex;
            align-items: center; justify-content: center;
            padding: 0;
            border-radius: 8px;
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-color);
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: none;
            transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
        }
        .jp-day:hover { background: var(--item-hover); transform: none; box-shadow: none; }
        .jp-day.jp-empty { pointer-events: none; visibility: hidden; }
        .jp-day.jp-today-mark { border-color: var(--rank-text); color: var(--rank-text); }
        .jp-day.jp-selected {
            background: linear-gradient(135deg, #f97316, #dc2626);
            color: #fff;
            border-color: transparent;
            box-shadow: 0 4px 14px -2px rgba(220, 38, 38, 0.6);
        }

        .jp-foot {
            display: flex;
            gap: 8px;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid var(--border);
        }
        .jp-btn {
            flex: 1;
            background: var(--item-hover);
            border: 1px solid var(--border);
            color: var(--text-color);
            padding: 7px 10px;
            border-radius: 8px;
            font-size: 0.78rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: none;
        }
        .jp-btn:hover { background: var(--primary); color: #fff; transform: none; box-shadow: none; }
    </style>
</head>
<body>

    <div id="punisher-alert">
        <div class="punisher-text">خوش اومدی punisher</div>
    </div>

    <div id="welcome-splash">
        <div class="splash-content">
            <div class="splash-title">خوش آمدید</div>
            <div class="splash-subtitle">سیستم مدیریت ایستگاه‌ها</div>
        </div>
    </div>

    <div class="container">
        <header>
            <div>
                <h1>Base Selector </h1>
                <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 4px;">select base and rank </p>
            </div>
            <div class="actions">
                <button class="btn-theme-toggle" id="themeToggleBtn" onclick="toggleTheme()" title="تغییر تم روز و شب">🌙</button>
                <button class="btn-vip" onclick="openVipModal()">⭐ ویژه - VIP</button>
                <a href="https://t.me/ttafavot" target="_blank" class="btn-creator">
                    <span>سازنده</span>
                </a>
                <button class="btn-add-station" onclick="openStationModal()">➕ افزودن ایستگاه</button>
                <button class="btn-rotate" onclick="rotateStations()"> چرخش هفتگی</button>
                <button onclick="openModal()">➕ افزودن پلیر</button>
                <button class="btn-danger" onclick="resetData()">حذف همه</button>
            </div>
        </header>

        <input type="text" id="searchInput" class="search-box" placeholder="جستجوی نام، لقب یا رنک پلیر..." oninput="render()">

        <div class="grid" id="stationsGrid"></div>
    </div>

    <div class="modal" id="vipModal">
        <div class="modal-content">
            <h3>بخش ویژه VIP</h3>
            <p style="font-size: 0.85rem; color: var(--text-muted);">لطفاً کلید دسترسی اختصاصی را وارد کنید:</p>
            <div class="form-group">
                <label>کلید ورود</label>
                <input type="password" id="vipKeyInput" placeholder="رمز عبور..." onkeydown="if(event.key==='Enter') checkVipKey()">
            </div>
            <div class="modal-actions">
                <button style="background: transparent; color: var(--text-muted);" onclick="closeVipModal()">انصراف</button>
                <button class="btn-danger" id="removeVipBgBtn" style="display:none; background:#7f1d1d;" onclick="removeVipBackground()">حذف پس‌زمینه</button>
                <button onclick="checkVipKey()">بررسی کلید</button>
            </div>
        </div>
    </div>

    <div class="modal" id="stationModal">
        <div class="modal-content">
            <h3>افزودن ایستگاه جدید</h3>
            <div class="form-group">
                <label>نام ایستگاه</label>
                <input type="text" id="stationNameInput" placeholder="مثال: ایستگاه ۳" onkeydown="if(event.key==='Enter') addStation()">
            </div>
            <div class="modal-actions">
                <button style="background: transparent; color: var(--text-muted);" onclick="closeStationModal()">انصراف</button>
                <button onclick="addStation()">ذخیره</button>
            </div>
        </div>
    </div>

    <div class="modal" id="playerModal">
        <div class="modal-content">
            <h3 id="playerModalTitle">افزودن پلیر جدید</h3>
            <div class="form-group">
                <label>نام پلیر</label>
                <input type="text" id="playerNameInput" placeholder="مثال: FARAZ ">

            <div class="form-group">
                <label>رنک (۱ تا ۸)</label>
                <select id="playerRankInput">
                    <option value="1">رنک ۱</option>
                    <option value="2">رنک ۲</option>
                    <option value="3">رنک ۳</option>
                    <option value="4" selected>رنک ۴</option>
                    <option value="5">رنک ۵</option>
                    <option value="6">رنک ۶</option>
                    <option value="7">رنک ۷</option>
                    <option value="8">رنک ۸</option>
                </select>
            </div>
            <div class="form-group">
                <label>لقب (اختیاری)</label>
                <input type="text" id="playerNicknameInput" placeholder="مثال: معاون / سرپرست ">
            </div>

            <div class="form-group">
                <label>ایستگاه‌ها (می‌توانید چند ایستگاه انتخاب کنید)</label>
                <div class="station-rows" id="stationRowsContainer"></div>
                <button type="button" class="btn-add-station-row" onclick="addStationRow()">➕ افزودن ایستگاه دیگر</button>
            </div>

            <div class="form-group date-group">
                <label>تاریخ شروع فعالیت (شمسی)</label>
                <div class="date-input-wrap">
                    <input type="text" id="playerStartDateInput" placeholder="مثال: 1405/01/15"
                           autocomplete="off" inputmode="numeric">
                    <button type="button" class="date-icon-btn" id="jpToggleBtn" title="باز کردن تقویم">📅</button>
                </div>
                <div class="jp-calendar" id="jpCalendar"></div>
            </div>

            <div class="modal-actions">
                <button style="background: transparent; color: var(--text-muted);" onclick="closeModal()">انصراف</button>
                <button onclick="addPlayer()">ذخیره</button>
            </div>
        </div>
    </div>

    <script>
        (function () {
            var svg =
                '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">' +
                    '<defs>' +
                        '<linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">' +
                            '<stop offset="0" stop-color="#052e16"/>' +
                            '<stop offset="1" stop-color="#022c14"/>' +
                        '</linearGradient>' +
                    '</defs>' +
                    '<rect x="2" y="2" width="60" height="60" rx="14" ' +
                        'fill="url(#bgGrad)" stroke="#22c55e" stroke-width="2"/>' +
                    '<rect x="6" y="6" width="52" height="52" rx="11" ' +
                        'fill="none" stroke="#4ade80" stroke-width="0.8" opacity="0.7"/>' +
                    '<path d="M 20 16 L 20 48 L 32 48 ' +
                        'Q 46 48 46 32 Q 46 16 32 16 Z ' +
                        'M 26 22 L 32 22 ' +
                        'Q 39 22 39 32 Q 39 42 32 42 L 26 42 Z" ' +
                        'fill="#22c55e" fill-rule="evenodd"/>' +
                '</svg>';

            var link = document.createElement('link');
            link.rel = 'icon';
            link.type = 'image/svg+xml';
            link.href = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
            document.head.appendChild(link);
        })();

        const savedTheme = localStorage.getItem('site_theme') || 'dark';
        if (savedTheme === 'light') {
            document.documentElement.setAttribute('data-theme', 'light');
            document.getElementById('themeToggleBtn').textContent = '☀️';
        }

        const activeVipBg = localStorage.getItem('vip_background_image');
        if (activeVipBg) {
            document.documentElement.style.setProperty('--bg-image', `linear-gradient(rgba(18, 9, 9, 0.75), rgba(18, 9, 9, 0.85)), url('${activeVipBg}')`);
        }

        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const btn = document.getElementById('themeToggleBtn');
            if (currentTheme === 'light') {
                document.documentElement.removeAttribute('data-theme');
                localStorage.setItem('site_theme', 'dark');
                btn.textContent = '🌙';
            } else {
                document.documentElement.setAttribute('data-theme', 'light');
                localStorage.setItem('site_theme', 'light');
                btn.textContent = '☀️';
            }
        }

        function openVipModal() {
            const modal = document.getElementById('vipModal');
            document.getElementById('vipKeyInput').value = '';
            const removeBtn = document.getElementById('removeVipBgBtn');
            if (localStorage.getItem('vip_background_image')) {
                removeBtn.style.display = 'inline-block';
            } else {
                removeBtn.style.display = 'none';
            }
            modal.style.display = 'flex';
            setTimeout(() => modal.classList.add('show'), 10);
            document.getElementById('vipKeyInput').focus();
        }

        function closeVipModal() {
            const modal = document.getElementById('vipModal');
            modal.classList.remove('show');
            setTimeout(() => { modal.style.display = 'none'; }, 300);
        }

        function showPunisherMessage() {
            const alertBox = document.getElementById('punisher-alert');
            alertBox.classList.add('show');
            setTimeout(() => { alertBox.classList.remove('show'); }, 3500);
        }

        function checkVipKey() {
            const key = document.getElementById('vipKeyInput').value.trim();
            if (key === 'DAMAS') {
                const imageUrl = 'image.png';
                document.documentElement.style.setProperty('--bg-image', `linear-gradient(rgba(18, 9, 9, 0.75), rgba(18, 9, 9, 0.85)), url('${imageUrl}')`);
                localStorage.setItem('vip_background_image', imageUrl);
                closeVipModal();
                showPunisherMessage();
            } else {
                alert('کلید اشتباه است!');
            }
        }

        function removeVipBackground() {
            document.documentElement.style.setProperty('--bg-image', 'none');
            localStorage.removeItem('vip_background_image');
            alert('پس‌زمینه اختصاصی حذف شد.');
            closeVipModal();
        }

        window.addEventListener('load', function() {
            setTimeout(() => {
                const splash = document.getElementById('welcome-splash');
                splash.classList.add('slide-up');
                setTimeout(() => { splash.style.display = 'none'; }, 1000);
            }, 800);
        });

        let players = JSON.parse(localStorage.getItem('rotation_players_v4')) || [];

        const STATION_COLORS = ['#f97316', '#ef4444', '#3b82f6', '#22c55e', '#a855f7', '#eab308', '#06b6d4', '#ec4899'];
        let stations = JSON.parse(localStorage.getItem('rotation_stations_v1'));
        if (!stations || !Array.isArray(stations) || stations.length === 0) {
            stations = [
                { id: 'st1', name: 'ایستگاه ۱ (St 1)', color: '#f97316' },
                { id: 'st2', name: 'ایستگاه ۲ (St 2)', color: '#ef4444' }
            ];
        }

        players = players.map(p => {
            if (!Array.isArray(p.stations)) {
                p.stations = p.station ? [p.station] : [stations[0].id];
            }
            p.stations = p.stations.filter(sid => stations.some(s => s.id === sid));
            if (p.stations.length === 0) p.stations = [stations[0].id];
            delete p.station;
            return p;
        });

        function saveStations() {
            localStorage.setItem('rotation_stations_v1', JSON.stringify(stations));
        }

        function getTodayShamsi() {
            try {
                return new Intl.DateTimeFormat('fa-IR', { year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date()).replace(/\//g, '/');
            } catch (e) { return "1405/01/01"; }
        }

        function saveAndRender() {
            localStorage.setItem('rotation_players_v4', JSON.stringify(players));
            render();
        }

        function openStationModal() {
            document.getElementById('stationNameInput').value = '';
            const modal = document.getElementById('stationModal');
            modal.style.display = 'flex';
            setTimeout(() => modal.classList.add('show'), 10);
            document.getElementById('stationNameInput').focus();
        }

        function closeStationModal() {
            const modal = document.getElementById('stationModal');
            modal.classList.remove('show');
            setTimeout(() => { modal.style.display = 'none'; }, 300);
        }

        function addStation() {
            const name = document.getElementById('stationNameInput').value.trim();
            if (!name) { alert('لطفاً نام ایستگاه را وارد کنید.'); return; }

            const id = 'st_' + Date.now().toString(36);
            const color = STATION_COLORS[stations.length % STATION_COLORS.length];
            stations.push({ id, name, color });
            saveStations();
            closeStationModal();
            render();
        }

        function deleteStation(id) {
            if (stations.length <= 1) {
                alert('حداقل یک ایستگاه باید وجود داشته باشد.');
                return;
            }
            const st = stations.find(s => s.id === id);
            if (!st) return;

            const playersInSt = players.filter(p => p.stations.includes(id)).length;
            const msg = playersInSt > 0
                ? `ایستگاه «${st.name}» حذف شود؟ این ایستگاه از لیست ${playersInSt} پلیر حذف می‌شود.`
                : `ایستگاه «${st.name}» حذف شود؟`;
            if (!confirm(msg)) return;

            const targetStation = stations.find(s => s.id !== id);

            players = players.map(p => {
                p.stations = p.stations.filter(sid => sid !== id);
                if (p.stations.length === 0) p.stations = [targetStation.id];
                return p;
            });

            stations = stations.filter(s => s.id !== id);
            saveStations();
            saveAndRender();
        }

        function buildStationSelect(selectedId) {
            const sel = document.createElement('select');
            stations.forEach(st => {
                const o = document.createElement('option');
                o.value = st.id;
                o.textContent = st.name;
                sel.appendChild(o);
            });
            if (selectedId) sel.value = selectedId;
            return sel;
        }

        function addStationRow(selectedId) {
            const container = document.getElementById('stationRowsContainer');
            const row = document.createElement('div');
            row.className = 'station-row';

            const sel = buildStationSelect(selectedId || (stations[0] && stations[0].id));
            row.appendChild(sel);

            const removeBtn = document.createElement('button');
            removeBtn.type = 'button';
            removeBtn.className = 'btn-remove-station';
            removeBtn.title = 'حذف این ایستگاه';
            removeBtn.textContent = '×';
            removeBtn.onclick = function () {
                row.remove();
                updateRemoveButtons();
            };
            row.appendChild(removeBtn);

            container.appendChild(row);
            updateRemoveButtons();
        }

        function updateRemoveButtons() {
            const rows = document.querySelectorAll('#stationRowsContainer .station-row');
            const disableRemove = rows.length <= 1;
            rows.forEach(r => {
                const btn = r.querySelector('.btn-remove-station');
                if (!btn) return;
                btn.style.display = disableRemove ? 'none' : 'flex';
            });
        }

        function clearStationRows() {
            const container = document.getElementById('stationRowsContainer');
            container.innerHTML = '';
        }

        function renderStationPanels() {
            const grid = document.getElementById('stationsGrid');
            grid.innerHTML = '';

            stations.forEach(st => {
                const panel = document.createElement('div');
                panel.className = 'panel';

                const canDelete = stations.length > 1;
                const deleteBtnHtml = canDelete
                    ? `<button class="btn-del-station" title="حذف ایستگاه" onclick="deleteStation('${st.id}')">✕</button>`
                    : '';

                panel.innerHTML = `
                    <div class="panel-header">
                        <span class="panel-title" style="color:${st.color}">${escapeHtml(st.name)}</span>
                        <div class="header-right">
                            <span class="badge-count" id="count-${st.id}">۰ نفر</span>
                            ${deleteBtnHtml}
                        </div>
                    </div>
                    <ul class="player-list" id="list-${st.id}"></ul>
                `;
                grid.appendChild(panel);
            });
        }

        function render() {
            const searchVal = document.getElementById('searchInput').value.trim().toLowerCase();

            renderStationPanels();

            stations.forEach(st => {
                const listEl = document.getElementById('list-' + st.id);
                if (listEl) listEl.innerHTML = '';
            });

            const filtered = players.filter(p =>
                p.name.toLowerCase().includes(searchVal) ||
                (p.nickname && p.nickname.toLowerCase().includes(searchVal)) ||
                (`رنک ${p.rank}`).toLowerCase().includes(searchVal) ||
                p.rank.includes(searchVal)
            );

            // گروه‌بندی پلیرها بر اساس ایستگاه
            const perStation = {};
            stations.forEach(st => perStation[st.id] = []);

            filtered.forEach(p => {
                p.stations = p.stations.filter(sid => stations.some(s => s.id === sid));
                if (p.stations.length === 0) p.stations = [stations[0].id];
                p.stations.forEach(stid => {
                    if (perStation[stid]) perStation[stid].push(p);
                });
            });

            // مرتب‌سازی هر ایستگاه بر اساس رنک از ۸ به ۱
            stations.forEach(st => {
                perStation[st.id].sort((a, b) => (parseInt(b.rank) || 0) - (parseInt(a.rank) || 0));
            });

            const counts = {};
            stations.forEach(st => counts[st.id] = 0);

            // رندر
            stations.forEach(st => {
                const listEl = document.getElementById('list-' + st.id);
                if (!listEl) return;

                perStation[st.id].forEach(p => {
                    const durationText = calculateDuration(p.timestamp);
                    const nicknameHtml = p.nickname ? `<span class="player-nickname-badge">🏷️ ${escapeHtml(p.nickname)}</span>` : '';

                    const li = document.createElement('li');
                    li.className = 'player-item';

                    li.innerHTML = `
                        <div class="player-info">
                            <div class="player-header-row">
                                <span class="player-name">👤 ${escapeHtml(p.name)}</span>
                                <span class="player-rank-badge">⭐ رنک ${p.rank}</span>
                                ${nicknameHtml}
                            </div>
                            <div class="player-meta">
                                <span>📅 شروع: ${escapeHtml(p.startDate || 'نامشخص')}</span>
                                <span>⏳ مدت حضور: ${durationText}</span>
                            </div>
                        </div>
                        <div class="player-actions">
                            <button class="btn-icon" title="جابجایی" onclick="switchStation(${p.id})">↔️</button>
                            <button class="btn-icon edit" title="ویرایش" onclick="editPlayer(${p.id})">✏️</button>
                            <button class="btn-icon delete" title="حذف" onclick="deletePlayer(${p.id})">❌</button>
                        </div>
                    `;

                    listEl.appendChild(li);
                    counts[st.id]++;
                });
            });

            stations.forEach(st => {
                const listEl = document.getElementById('list-' + st.id);
                const cntEl = document.getElementById('count-' + st.id);
                if (listEl && counts[st.id] === 0) {
                    listEl.innerHTML = '<div class="empty-state">خالی است</div>';
                }
                if (cntEl) cntEl.textContent = `${counts[st.id]} نفر`;
            });
        }

        function escapeHtml(text) {
            return String(text)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        let editingPlayerId = null;

        function openModal() {
            editingPlayerId = null;
            const titleEl = document.getElementById('playerModalTitle');
            if (titleEl) titleEl.textContent = 'افزودن پلیر جدید';

            document.getElementById('playerNameInput').value = '';
            document.getElementById('playerNicknameInput').value = '';
            document.getElementById('playerRankInput').value = '4';
            document.getElementById('playerStartDateInput').value = getTodayShamsi();
            if (window.jpDatePicker) window.jpDatePicker.close();

            clearStationRows();
            addStationRow(stations[0] ? stations[0].id : null);

            const modal = document.getElementById('playerModal');
            modal.style.display = 'flex';
            setTimeout(() => modal.classList.add('show'), 10);
            document.getElementById('playerNameInput').focus();
        }

        function editPlayer(id) {
            const p = players.find(pl => pl.id === id);
            if (!p) return;

            editingPlayerId = id;

            const titleEl = document.getElementById('playerModalTitle');
            if (titleEl) titleEl.textContent = 'ویرایش اطلاعات پلیر';

            document.getElementById('playerNameInput').value = p.name || '';
            document.getElementById('playerRankInput').value = p.rank || '4';
            document.getElementById('playerNicknameInput').value = p.nickname || '';
            document.getElementById('playerStartDateInput').value = p.startDate || getTodayShamsi();
            if (window.jpDatePicker) window.jpDatePicker.close();

            clearStationRows();
            const sts = (Array.isArray(p.stations) && p.stations.length) ? p.stations : [stations[0].id];
            sts.forEach(sid => addStationRow(sid));
            updateRemoveButtons();

            const modal = document.getElementById('playerModal');
            modal.style.display = 'flex';
            setTimeout(() => modal.classList.add('show'), 10);
            document.getElementById('playerNameInput').focus();
        }

        function closeModal() {
            editingPlayerId = null;
            const titleEl = document.getElementById('playerModalTitle');
            if (titleEl) titleEl.textContent = 'افزودن پلیر جدید';

            if (window.jpDatePicker) window.jpDatePicker.close();
            const modal = document.getElementById('playerModal');
            modal.classList.remove('show');
            setTimeout(() => { modal.style.display = 'none'; }, 300);
        }

        function parseShamsiDate(str) {
            if (!str) return null;
            var normalized = String(str)
                .replace(/[۰-۹]/g, function (d) { return String('۰۱۲۳۴۵۶۷۸۹'.indexOf(d)); })
                .replace(/[٠-٩]/g, function (d) { return String('٠١٢٣٤٥٦٧٨٩'.indexOf(d)); });
            var m = normalized.match(/^\s*(\d{4})\s*[\/\-\.]\s*(\d{1,2})\s*[\/\-\.]\s*(\d{1,2})\s*$/);
            if (!m) return null;
            var jy = +m[1], jm = +m[2], jd = +m[3];
            if (jy < 1200 || jy > 1600) return null;
            if (jm < 1 || jm > 12) return null;
            if (jd < 1 || jd > JalaaliDate.jalaaliMonthLength(jy, jm)) return null;
            return { jy: jy, jm: jm, jd: jd };
        }

        function addPlayer() {
            const name = document.getElementById('playerNameInput').value.trim();
            const rank = document.getElementById('playerRankInput').value;
            const nickname = document.getElementById('playerNicknameInput').value.trim();
            let startDate = document.getElementById('playerStartDateInput').value.trim();

            if (!name) { alert('لطفاً نام پلیر را وارد کنید.'); return; }
            if (!startDate) startDate = getTodayShamsi();

            const selects = document.querySelectorAll('#stationRowsContainer .station-row select');
            const selectedStations = [];
            selects.forEach(s => {
                if (s.value && !selectedStations.includes(s.value)) {
                    selectedStations.push(s.value);
                }
            });

            if (selectedStations.length === 0) {
                alert('لطفاً حداقل یک ایستگاه انتخاب کنید.');
                return;
            }

            let timestamp = Date.now();
            const parsed = parseShamsiDate(startDate);
            if (parsed) {
                const g = JalaaliDate.toGregorian(parsed.jy, parsed.jm, parsed.jd);
                const d = new Date(g.gy, g.gm - 1, g.gd);
                timestamp = d.getTime();
            } else if (editingPlayerId !== null) {
                const old = players.find(pl => pl.id === editingPlayerId);
                if (old && old.timestamp) timestamp = old.timestamp;
            }

            if (editingPlayerId !== null) {
                players = players.map(pl => {
                    if (pl.id !== editingPlayerId) return pl;
                    pl.name = name;
                    pl.rank = rank;
                    pl.nickname = nickname;
                    pl.stations = selectedStations;
                    pl.startDate = startDate;
                    pl.timestamp = timestamp;
                    return pl;
                });
                editingPlayerId = null;
                const titleEl = document.getElementById('playerModalTitle');
                if (titleEl) titleEl.textContent = 'افزودن پلیر جدید';
                saveAndRender();
                closeModal();
                return;
            }

            players.push({
                id: Date.now(),
                name, rank, nickname,
                stations: selectedStations,
                startDate, timestamp
            });
            saveAndRender();
            closeModal();
        }

        function deletePlayer(id) {
            if (confirm('آیا از حذف این پلیر مطمئن هستید؟')) {
                players = players.filter(p => p.id !== id);
                saveAndRender();
            }
        }

        function switchStation(id) {
            players = players.map(p => {
                if (p.id !== id) return p;
                const rotated = p.stations.map(sid => {
                    const idx = stations.findIndex(s => s.id === sid);
                    if (idx === -1) return stations[0].id;
                    return stations[(idx + 1) % stations.length].id;
                });
                p.stations = [...new Set(rotated)];
                p.startDate = getTodayShamsi();
                p.timestamp = Date.now();
                return p;
            });
            saveAndRender();
        }

        function rotateStations() {
            if (players.length === 0) { alert('پلیری برای چرخش وجود ندارد.'); return; }
            if (stations.length < 2) { alert('برای چرخش حداقل به دو ایستگاه نیاز است.'); return; }
            if (confirm('آیا می‌خواهید چرخش هفتگی را برای تمام اعضا انجام دهید؟')) {
                const today = getTodayShamsi();
                const now = Date.now();
                players = players.map(p => {
                    const rotated = p.stations.map(sid => {
                        const idx = stations.findIndex(s => s.id === sid);
                        if (idx === -1) return stations[0].id;
                        return stations[(idx + 1) % stations.length].id;
                    });
                    p.stations = [...new Set(rotated)];
                    p.startDate = today;
                    p.timestamp = now;
                    return p;
                });
                saveAndRender();
                alert('چرخش هفتگی با موفقیت انجام شد!');
            }
        }

        function resetData() {
            if (confirm('هشدار: تمام اطلاعات پاک خواهد شد. ادامه می‌دهید؟')) {
                players = [];
                saveAndRender();
            }
        }

        function calculateDuration(timestamp) {
            if (!timestamp) return 'نامشخص';
            const diffTime = Math.abs(Date.now() - timestamp);
            const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
            if (diffDays === 0) return 'امروز شروع کرده';
            if (diffDays === 1) return '۱ روز';
            if (diffDays < 7) return `${diffDays} روز`;
            const weeks = Math.floor(diffDays / 7);
            const days = diffDays % 7;
            return days === 0 ? `${weeks} هفته` : `${weeks} هفته و ${days} روز`;
        }

        var JalaaliDate = (function () {
            function div(a, b) { return ~~(a / b); }
            function mod(a, b) { return a - ~~(a / b) * b; }

            function jalCal(jy, withoutLeap) {
                var breaks = [-61, 9, 38, 199, 426, 686, 756, 818, 1111, 1181, 1210,
                    1635, 2060, 2097, 2192, 2262, 2324, 2394, 2456, 3178];
                var bl = breaks.length;
                var gy = jy + 621, leapJ = -14, jp = breaks[0];
                var jm, jump = 0, leap = 0, leapG, march, n, i;

                if (jy < jp || jy >= breaks[bl - 1]) throw new Error('Invalid Jalaali year ' + jy);

                for (i = 1; i < bl; i += 1) {
                    jm = breaks[i];
                    jump = jm - jp;
                    if (jy < jm) break;
                    leapJ = leapJ + div(jump, 33) * 8 + div(mod(jump, 33), 4);
                    jp = jm;
                }
                n = jy - jp;

                leapJ = leapJ + div(n, 33) * 8 + div(mod(n, 33) + 3, 4);
                if (mod(jump, 33) === 4 && jump - n === 4) leapJ += 1;

                leapG = div(gy, 4) - div((div(gy, 100) + 1) * 3, 4) - 150;
                march = 20 + leapJ - leapG;

                if (!withoutLeap) {
                    if (jump - n < 6) n = n - jump + div(jump + 4, 33) * 33;
                    leap = mod(mod(n + 1, 33) - 1, 4);
                    if (leap === -1) leap = 4;
                }
                return { leap: leap, gy: gy, march: march };
            }

            function g2d(gy, gm, gd) {
                var d = div((gy + div(gm - 8, 6) + 100100) * 1461, 4) +
                        div(153 * mod(gm + 9, 12) + 2, 5) + gd - 34840408;
                d = d - div(div(gy + 100100 + div(gm - 8, 6), 100) * 3, 4) + 752;
                return d;
            }

            function d2g(jdn) {
                var j = 4 * jdn + 139361631;
                j = j + div(div(4 * jdn + 183187720, 146097) * 3, 4) * 4 - 3908;
                var i = div(mod(j, 1461), 4) * 5 + 308;
                var gd = div(mod(i, 153), 5) + 1;
                var gm = mod(div(i, 153), 12) + 1;
                var gy = div(j, 1461) - 100100 + div(8 - gm, 6);
                return { gy: gy, gm: gm, gd: gd };
            }

            function j2d(jy, jm, jd) {
                var r = jalCal(jy, true);
                return g2d(r.gy, 3, r.march) + (jm - 1) * 31 - div(jm, 7) * (jm - 7) + jd - 1;
            }

            function d2j(jdn) {
                var gy = d2g(jdn).gy;
                var jy = gy - 621;
                var r = jalCal(jy, false);
                var jdn1f = g2d(gy, 3, r.march);
                var jd, jm, k;

                k = jdn - jdn1f;
                if (k >= 0) {
                    if (k <= 185) {
                        jm = 1 + div(k, 31);
                        jd = mod(k, 31) + 1;
                        return { jy: jy, jm: jm, jd: jd };
                    } else {
                        k -= 186;
                    }
                } else {
                    jy -= 1;
                    k += 179;
                    if (r.leap === 1) k += 1;
                }
                jm = 7 + div(k, 30);
                jd = mod(k, 30) + 1;
                return { jy: jy, jm: jm, jd: jd };
            }

            function isLeapJalaali(jy) { return jalCal(jy, false).leap === 0; }

            function jalaaliMonthLength(jy, jm) {
                if (jm <= 6) return 31;
                if (jm <= 11) return 30;
                return isLeapJalaali(jy) ? 30 : 29;
            }

            function toJalaali(date) {
                return d2j(g2d(date.getFullYear(), date.getMonth() + 1, date.getDate()));
            }

            function toGregorian(jy, jm, jd) {
                var jdn = j2d(jy, jm, jd);
                return d2g(jdn);
            }

            return {
                toJalaali: toJalaali,
                j2d: j2d,
                jalaaliMonthLength: jalaaliMonthLength,
                toGregorian: toGregorian
            };
        })();

        (function () {
            var MONTHS = ['فروردین', 'اردیبهشت', 'خرداد', 'تیر', 'مرداد', 'شهریور',
                          'مهر', 'آبان', 'آذر', 'دی', 'بهمن', 'اسفند'];
            var WEEK = ['ش', 'ی', 'د', 'س', 'چ', 'پ', 'ج'];

            var input = document.getElementById('playerStartDateInput');
            var cal = document.getElementById('jpCalendar');
            var toggleBtn = document.getElementById('jpToggleBtn');
            if (!input || !cal) return;

            function pad(n) { return (n < 10 ? '0' : '') + n; }
            function fa(s) {
                return String(s).replace(/[0-9]/g, function (d) { return '۰۱۲۳۴۵۶۷۸۹'[+d]; });
            }

            var todayJ = JalaaliDate.toJalaali(new Date());
            var viewJy = todayJ.jy, viewJm = todayJ.jm;
            var selJy = null, selJm = null, selJd = null;
            var built = false;

            function parseValue(v) {
                if (!v) return null;
                var normalized = String(v)
                    .replace(/[۰-۹]/g, function (d) { return String('۰۱۲۳۴۵۶۷۸۹'.indexOf(d)); })
                    .replace(/[٠-٩]/g, function (d) { return String('٠١٢٣٤٥٦٧٨٩'.indexOf(d)); });
                var m = normalized.match(/^\s*(\d{4})\s*[\/\-\.]\s*(\d{1,2})\s*[\/\-\.]\s*(\d{1,2})\s*$/);
                if (!m) return null;
                var jy = +m[1], jm = +m[2], jd = +m[3];
                if (jy < 1200 || jy > 1600) return null;
                if (jm < 1 || jm > 12) return null;
                if (jd < 1 || jd > JalaaliDate.jalaaliMonthLength(jy, jm)) return null;
                return { jy: jy, jm: jm, jd: jd };
            }

            function build() {
                if (built) return;
                built = true;

                var head = document.createElement('div');
                head.className = 'jp-head';
                head.setAttribute('dir', 'ltr');
                head.innerHTML =
                    '<button type="button" class="jp-nav" data-nav="-1" aria-label="ماه قبل">❮</button>' +
                    '<select class="jp-select jp-month" dir="rtl" aria-label="ماه"></select>' +
                    '<select class="jp-select jp-year" dir="rtl" aria-label="سال"></select>' +
                    '<button type="button" class="jp-nav" data-nav="1" aria-label="ماه بعد">❯</button>';
                cal.appendChild(head);

                var week = document.createElement('div');
                week.className = 'jp-week';
                WEEK.forEach(function (w) {
                    var s = document.createElement('span');
                    s.textContent = w;
                    week.appendChild(s);
                });
                cal.appendChild(week);

                var grid = document.createElement('div');
                grid.className = 'jp-grid';
                cal.appendChild(grid);

                var foot = document.createElement('div');
                foot.className = 'jp-foot';
                foot.innerHTML =
                    '<button type="button" class="jp-btn jp-today">امروز</button>' +
                    '<button type="button" class="jp-btn jp-clear">پاک کردن</button>';
                cal.appendChild(foot);

                var mSel = cal.querySelector('.jp-month');
                MONTHS.forEach(function (name, idx) {
                    var o = document.createElement('option');
                    o.value = String(idx + 1);
                    o.textContent = name;
                    mSel.appendChild(o);
                });

                var ySel = cal.querySelector('.jp-year');
                for (var y = todayJ.jy - 80; y <= todayJ.jy + 20; y++) {
                    var o2 = document.createElement('option');
                    o2.value = String(y);
                    o2.textContent = fa(y);
                    ySel.appendChild(o2);
                }

                mSel.addEventListener('change', function () { viewJm = +this.value; render(); });
                ySel.addEventListener('change', function () { viewJy = +this.value; render(); });

                head.addEventListener('click', function (e) {
                    var btn = e.target.closest('.jp-nav');
                    if (!btn) return;
                    changeMonth(+btn.dataset.nav);
                });

                grid.addEventListener('click', function (e) {
                    var cell = e.target.closest('.jp-day');
                    if (!cell || cell.classList.contains('jp-empty')) return;
                    var jd = +cell.dataset.day;
                    selJy = viewJy; selJm = viewJm; selJd = jd;
                    input.value = viewJy + '/' + pad(viewJm) + '/' + pad(jd);
                    render();
                    close();
                });

                cal.querySelector('.jp-today').addEventListener('click', function () {
                    var t = JalaaliDate.toJalaali(new Date());
                    selJy = t.jy; selJm = t.jm; selJd = t.jd;
                    viewJy = t.jy; viewJm = t.jm;
                    input.value = t.jy + '/' + pad(t.jm) + '/' + pad(t.jd);
                    render();
                    close();
                });

                cal.querySelector('.jp-clear').addEventListener('click', function () {
                    selJy = selJm = selJd = null;
                    input.value = '';
                    render();
                    close();
                });
            }

            function changeMonth(delta) {
                viewJm += delta;
                if (viewJm > 12) { viewJm = 1; viewJy += 1; }
                else if (viewJm < 1) { viewJm = 12; viewJy -= 1; }
                render();
            }

            function render() {
                build();

                var mSel = cal.querySelector('.jp-month');
                var ySel = cal.querySelector('.jp-year');

                mSel.value = String(viewJm);
                if (!ySel.querySelector('option[value="' + viewJy + '"]')) {
                    var o = document.createElement('option');
                    o.value = String(viewJy);
                    o.textContent = fa(viewJy);
                    ySel.appendChild(o);
                }
                ySel.value = String(viewJy);

                var grid = cal.querySelector('.jp-grid');
                grid.innerHTML = '';

                var monthLen = JalaaliDate.jalaaliMonthLength(viewJy, viewJm);
                var firstJdn = JalaaliDate.j2d(viewJy, viewJm, 1);
                var startCol = ((firstJdn % 7) + 2 + 7) % 7;
                var t = JalaaliDate.toJalaali(new Date());

                var i;
                for (i = 0; i < startCol; i++) {
                    var blank = document.createElement('span');
                    blank.className = 'jp-day jp-empty';
                    grid.appendChild(blank);
                }

                for (var d = 1; d <= monthLen; d++) {
                    var el = document.createElement('button');
                    el.type = 'button';
                    el.className = 'jp-day';
                    el.dataset.day = String(d);
                    el.textContent = fa(d);

                    if (viewJy === t.jy && viewJm === t.jm && d === t.jd) {
                        el.classList.add('jp-today-mark');
                    }
                    if (selJy === viewJy && selJm === viewJm && selJd === d) {
                        el.classList.add('jp-selected');
                    }
                    grid.appendChild(el);
                }

                var total = startCol + monthLen;
                var tail = (7 - (total % 7)) % 7;
                for (i = 0; i < tail; i++) {
                    var blank2 = document.createElement('span');
                    blank2.className = 'jp-day jp-empty';
                    grid.appendChild(blank2);
                }
            }

            function positionCalendar() {
                cal.classList.remove('open-up');
                var rect = input.getBoundingClientRect();
                var h = cal.offsetHeight || 340;
                var spaceBelow = window.innerHeight - rect.bottom - 20;
                var spaceAbove = rect.top - 20;
                if (spaceBelow < h && spaceAbove > spaceBelow) {
                    cal.classList.add('open-up');
                }
            }

            function open() {
                build();

                var parsed = parseValue(input.value);
                if (parsed) {
                    selJy = parsed.jy; selJm = parsed.jm; selJd = parsed.jd;
                    viewJy = parsed.jy; viewJm = parsed.jm;
                } else {
                    selJy = selJm = selJd = null;
                    viewJy = todayJ.jy; viewJm = todayJ.jm;
                }

                render();
                cal.classList.add('show');
                requestAnimationFrame(positionCalendar);
            }

            function close() {
                cal.classList.remove('show');
                cal.classList.remove('open-up');
            }

            function isOpen() { return cal.classList.contains('show'); }

            input.addEventListener('focus', function () { if (!isOpen()) open(); });
            input.addEventListener('click', function () { if (!isOpen()) open(); });

            if (toggleBtn) {
                toggleBtn.addEventListener('click', function (e) {
                    e.preventDefault();
                    e.stopPropagation();
                    if (isOpen()) { close(); } else { open(); input.focus(); }
                });
            }

            input.addEventListener('blur', function () {
                var p = parseValue(input.value);
                if (p) input.value = p.jy + '/' + pad(p.jm) + '/' + pad(p.jd);
            });
            input.addEventListener('change', function () {
                var p = parseValue(input.value);
                if (p) input.value = p.jy + '/' + pad(p.jm) + '/' + pad(p.jd);
            });

            document.addEventListener('mousedown', function (e) {
                if (!isOpen()) return;
                if (cal.contains(e.target) || e.target === input) return;
                if (toggleBtn && (e.target === toggleBtn || toggleBtn.contains(e.target))) return;
                close();
            });

            document.addEventListener('keydown', function (e) {
                if (e.key === 'Escape' && isOpen()) close();
            });

            window.addEventListener('resize', function () {
                if (isOpen()) positionCalendar();
            });

            window.jpDatePicker = { open: open, close: close, render: render };
        })();

        render();
    </script>
</body>
</html>
